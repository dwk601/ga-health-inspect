services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: health_scratch
      POSTGRES_USER: scratch_admin
      POSTGRES_PASSWORD: scratch-admin-only
    ports: ["127.0.0.1::5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${ETL_SCHEMA_PATH:?ETL_SCHEMA_PATH is required}:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./dev/readonly-role.sql:/docker-entrypoint-initdb.d/03-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U scratch_admin -d health_scratch"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--requirepass", "scratch-redis-only", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=scratch-redis-only redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.28.2@sha256:28a161f4a39c70671d0fb771a6e7a3abe6d2144c0e2a595ff72767ab63cd14f6
    ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
volumes:
  pgdata:
